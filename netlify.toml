# Netlify config for the Simple+ web preview.
# Build with `npm run build:web` (expo export --platform web) into dist/.

[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# expo-router runs as a single-page app (app.json -> web.output "single"),
# so every path must fall through to index.html rather than 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
